# =============================================================================
# KubeCommerce - Terraform (Phase 13)
#
# PR / push:  fmt + validate (no backend, no AWS credentials)
# Dispatch:   OIDC-authenticated `plan`, and an `apply` gated behind the
#             protected GitHub environment `aws`.
#
# No long-lived AWS keys: the AWS jobs assume vars.AWS_ROLE_ARN via GitHub
# OIDC. The role and its trust policy are provisioned by
# infra/terraform/modules/iam/github_oidc. Third-party actions are pinned to
# full commit SHAs with a `# vX.Y.Z` comment.
#
# OIDC subject per job (must match the role's `allowed_subjects`):
#   plan  -> repo:bipulprasadjain007/kubecommerce:ref:refs/heads/main
#            (no GitHub environment is attached to `plan`, so the ref-based
#             subject is used)
#   apply -> repo:bipulprasadjain007/kubecommerce:environment:aws
#            (`apply` is gated by the protected GitHub environment `aws`)
#
# Required GitHub configuration (repository variables):
#   vars.AWS_ROLE_ARN  role assumed by the plan/apply jobs
#   vars.AWS_REGION    region for the AWS CLI/STS calls (default us-east-1)
# Protected environment:
#   aws                required reviewers for `apply`
# =============================================================================

name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply]
        default: plan

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# Default is read-only; `id-token: write` is granted only to the AWS jobs.
permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  # Kept in sync with infra/README.md and the local validation run.
  TERRAFORM_VERSION: "1.16.4"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  # ---------------------------------------------------------------------------
  # Formatting - always runs, needs no cloud access.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -recursive -check infra/terraform

  # ---------------------------------------------------------------------------
  # Validate every environment (-backend=false: no state, no credentials).
  # ---------------------------------------------------------------------------
  validate:
    name: validate (${{ matrix.environment }})
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform init (no backend)
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Plan - manual only, authenticated to AWS via OIDC.
  # ---------------------------------------------------------------------------
  plan:
    name: plan (${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: kubecommerce-tf-plan-${{ github.run_id }}

      - name: terraform init
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform init -input=false

      - name: terraform plan
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/terraform/environments/${{ inputs.environment }}/tfplan
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Apply - manual only, gated behind the protected `aws` environment and the
  # success of `plan`. Applies the exact plan artifact that was reviewed.
  # ---------------------------------------------------------------------------
  apply:
    name: apply (${{ inputs.environment }})
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: aws
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: kubecommerce-tf-apply-${{ github.run_id }}

      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/terraform/environments/${{ inputs.environment }}

      - name: terraform init
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        run: terraform apply -input=false -no-color tfplan
