# =============================================================================
# KubeCommerce - Release (Phase 7.2, 7.3, 8.3)
#
# Publishes immutable, scanned, SBOM'd, provenance-attested container images to
# GHCR and opens a GitOps promotion PR for the changed services. Production
# promotion remains a reviewed pull request - this workflow never auto-approves
# or deploys to production.
#
#   * Triggered on push to main, on v* tags, and manually.
#   * Never pushes `latest`; images are tagged with the full Git SHA (plus vX.Y.Z
#     on tags) and referenced by digest downstream.
#   * Third-party actions are pinned to full commit SHAs (see `# vX.Y.Z`).
#
# Required configuration (GitHub settings - see README/docs):
#   secrets.GITOPS_TOKEN  PAT/GitHub App token with repo scope on the GitOps repo
#   vars.GITOPS_REPO      GitOps repo name (default: kubecommerce-gitops)
#   vars.AWS_ROLE_ARN / vars.AWS_REGION / vars.AWS_ACCOUNT_ID  for the ECR OIDC
#                         placeholder job (only used with registry=ecr)
# =============================================================================

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      registry:
        description: "Target registry for the optional AWS OIDC placeholder"
        type: choice
        options: [ghcr, ecr]
        default: ghcr
      sign:
        description: "Keyless-sign images with Cosign"
        type: boolean
        default: false
      gitops:
        description: "Open a GitOps dev promotion PR"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"

jobs:
  # ---------------------------------------------------------------------------
  # Change detection - all services on tags / manual, otherwise the push range.
  # ---------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services: ${{ steps.detect.outputs.services }}
      projects: ${{ steps.detect.outputs.projects }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all_services=()
          for d in services/*/; do
            [ -f "${d}pyproject.toml" ] && all_services+=("${d%/}")
          done

          changed=""
          force_all=0
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] || [[ "${REF_NAME}" == refs/tags/* ]]; then
            # Tags and manual runs always release every service.
            force_all=1
          elif [ -z "${BEFORE_SHA:-}" ] || printf '%s' "${BEFORE_SHA}" | grep -Eq '^0+$'; then
            force_all=1
          elif ! changed="$(git diff --name-only "${BEFORE_SHA}" "${PUSH_SHA}")"; then
            # `before` unreachable after a force-push: fail safe to all services.
            force_all=1
          fi

          sel_services=()
          add_unique() {
            local -n _arr="$1"
            local v="$2" e
            for e in "${_arr[@]}"; do
              [ "${e}" = "${v}" ] && return 0
            done
            _arr+=("${v}")
          }

          libs_changed=()
          if [ "${force_all}" -eq 1 ]; then
            if [ "${#all_services[@]}" -gt 0 ]; then sel_services=("${all_services[@]}"); fi
          else
            while IFS= read -r f; do
              [ -n "${f}" ] || continue
              case "${f}" in
                services/*)
                  rest="${f#services/}"; svc="${rest%%/*}"
                  if [ -f "services/${svc}/pyproject.toml" ]; then
                    add_unique sel_services "services/${svc}"
                  fi
                  ;;
                libs/*)
                  rest="${f#libs/}"; lib="${rest%%/*}"
                  if [ -f "libs/${lib}/pyproject.toml" ]; then
                    add_unique libs_changed "libs/${lib}"
                  fi
                  ;;
              esac
            done <<< "${changed}"

            for lib in "${libs_changed[@]}"; do
              case "${lib}" in
                libs/observability)
                  sel_services=()
                  if [ "${#all_services[@]}" -gt 0 ]; then sel_services=("${all_services[@]}"); fi
                  ;;
                libs/contracts)
                  add_unique sel_services services/order-service
                  add_unique sel_services services/notification-worker
                  ;;
              esac
            done
          fi

          proj_objs=()
          for p in "${sel_services[@]}"; do
            name="${p##*/}"
            proj_objs+=("$(jq -nc --arg name "${name}" --arg path "${p}" '{name:$name,path:$path}')")
          done

          services_json='[]'
          if [ "${#proj_objs[@]}" -gt 0 ]; then
            services_json="$(printf '%s\n' "${sel_services[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          fi
          projects_json='[]'
          if [ "${#proj_objs[@]}" -gt 0 ]; then
            projects_json="$(printf '%s\n' "${proj_objs[@]}" | jq -sc '.')"
          fi
          any=false
          if [ "${#sel_services[@]}" -gt 0 ]; then any=true; fi

          {
            printf 'services=%s\n' "${services_json}"
            printf 'projects=%s\n' "${projects_json}"
            printf 'any=%s\n' "${any}"
          } >> "${GITHUB_OUTPUT}"

          echo "Services to release: ${services_json}"

  # ---------------------------------------------------------------------------
  # Build, push, scan, attest, SBOM, optional sign - matrix over services.
  # ---------------------------------------------------------------------------
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image coordinates (lowercase owner for OCI)
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.project.name }}
        run: |
          set -euo pipefail
          # OCI repository names must be lowercase; GitHub owners can be mixed-case.
          echo "image=ghcr.io/${OWNER,,}/kubecommerce-${SERVICE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          img="${IMAGE}"
          {
            echo "tags<<KUBE_TAGS"
            printf '%s:%s\n' "${img}" "${GITHUB_SHA}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              printf '%s:%s\n' "${img}" "${GITHUB_REF_NAME}"
            fi
            echo "KUBE_TAGS"
          } >> "${GITHUB_OUTPUT}"

      # Two-pass build: pass 1 builds the image locally (fast, fully cached via
      # type=gha) so Trivy can scan it BEFORE anything is published; pass 2
      # re-pushes the identical layers with BuildKit provenance and yields the
      # immutable digest used by SBOM/attest/cosign. `scan-before-push` and
      # `provenance: true` cannot both come from one step: the docker exporter
      # used by `load: true` cannot emit provenance, and a push-first step would
      # publish an unscanned image.
      - name: Build image locally, no push (${{ matrix.project.name }})
        id: build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.project.name }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          # GIT_SHA lets the image build stamp the revision into OCI labels.
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.project.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project.name }}

      - name: Trivy scan local image before push (${{ matrix.project.name }}, CRITICAL gate)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.image }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image with provenance (${{ matrix.project.name }})
        id: push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.project.name }}/Dockerfile
          load: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: true
          sbom: false
          cache-from: type=gha,scope=${{ matrix.project.name }}

      - name: Generate SBOM - SPDX
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.project.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM - CycloneDX
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.project.name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr') && (startsWith(github.ref, 'refs/tags/v') || inputs.sign) }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless via OIDC)
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr') && (startsWith(github.ref, 'refs/tags/v') || inputs.sign) }}
        run: cosign sign --yes "${{ steps.image.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Write per-image release metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          jq -nc \
            --arg service "${{ matrix.project.name }}" \
            --arg image "${IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF_NAME}" \
            '{service:$service,image:$image,digest:$digest,git_sha:$sha,git_ref:$ref,scan:"passed"}' \
            > release-meta-${{ matrix.project.name }}.json

      - name: Upload SBOM artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.project.name }}
          path: |
            sbom-${{ matrix.project.name }}.spdx.json
            sbom-${{ matrix.project.name }}.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload image release metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-meta-${{ matrix.project.name }}
          path: release-meta-${{ matrix.project.name }}.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # GitOps promotion: update environments/dev/values.yaml and open a PR.
  # Requires secrets.GITOPS_TOKEN (see docs/runbook.md). Skipped cleanly when
  # the token is absent.
  # ---------------------------------------------------------------------------
  gitops-promotion:
    name: gitops-promotion
    needs: [changes, build]
    if: >-
      needs.build.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'workflow_dispatch' || (inputs.gitops && inputs.registry == 'ghcr'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check GitOps token
        id: gate
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -n "${GITOPS_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::secrets.GITOPS_TOKEN is not set; skipping GitOps promotion."
          fi

      - name: Check out GitOps repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ vars.GITOPS_REPO || 'kubecommerce-gitops' }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      - name: Update dev image tags
        if: steps.gate.outputs.enabled == 'true'
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import pathlib

          # `SERVICES` holds paths like `services/order-service`; values.yaml
          # keys are the bare service slugs.
          services = {s.rsplit("/", 1)[-1] for s in json.loads(os.environ["SERVICES"])}
          image_tag = os.environ["IMAGE_TAG"]
          path = pathlib.Path("gitops/environments/dev/values.yaml")
          lines = path.read_text().splitlines()

          out = []
          current = None
          updated = []
          for line in lines:
              m = re.match(r"^  ([a-zA-Z0-9-]+):\s*$", line)
              if m:
                  current = m.group(1)
              if current in services and re.match(r"^      tag:\s+", line):
                  line = re.sub(r"(^      tag:\s+).*$", r"\g<1>" + image_tag, line)
                  updated.append(current)
              out.append(line)

          path.write_text("\n".join(out) + "\n")
          print("Updated services:", sorted(set(updated)))
          PY

      - name: Open GitOps promotion pull request
        if: steps.gate.outputs.enabled == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          base: main
          branch: ci/dev-images-${{ github.sha }}
          delete-branch: true
          commit-message: "chore(dev): promote ${{ github.repository }}@${{ github.sha }}"
          title: "chore(dev): promote ${{ github.repository }}@${{ github.sha }}"
          body: |
            Automated **dev** promotion from the application repository.

            * Application repo: `${{ github.repository }}`
            * Commit: `${{ github.sha }}`
            * Image tag: `${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}`
            * Services: `${{ needs.changes.outputs.services }}`

            Production promotion is intentionally **not** automated: open a
            separate reviewed PR for `environments/prod/values.yaml` and require
            environment approval. See `docs/runbook.md`.

  # ---------------------------------------------------------------------------
  # AWS OIDC placeholder (Phase 7.3): only runs for manual `registry: ecr`.
  # Full ECR build/push and EKS deployment come in Phase 13. This proves the
  # keyless federation path works without any long-lived AWS access keys.
  # ---------------------------------------------------------------------------
  aws-oidc-placeholder:
    name: aws-oidc-placeholder
    if: github.event_name == 'workflow_dispatch' && inputs.registry == 'ecr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: kubecommerce-gha-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Placeholder summary
        run: |
          echo "ECR registry: ${{ steps.ecr.outputs.registry }}"
          echo "AWS OIDC federation verified. ECR build/push + EKS land in Phase 13."

  # ---------------------------------------------------------------------------
  # Release summary + metadata artifact; attach SBOMs to the GitHub Release on
  # v* tags.
  # ---------------------------------------------------------------------------
  release-summary:
    name: release-summary
    needs: [changes, build]
    if: >-
      always() && needs.changes.result == 'success' && needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.registry == 'ghcr')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-meta-*
          path: metadata
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true

      - name: Build release metadata
        run: |
          set -euo pipefail
          jq -s --arg sha "${GITHUB_SHA}" --arg ref "${GITHUB_REF_NAME}" \
            '{git_sha:$sha, git_ref:$ref, images:.}' metadata/*.json \
            > release-metadata.json
          {
            echo "## Release ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            echo ""
            echo "| Service | Image | Digest | Scan |"
            echo "|---|---|---|---|"
            jq -r '.images[] | "| \(.service) | \(.image) | `\(.digest)` | \(.scan) |"' release-metadata.json
            echo ""
            echo "### SBOMs"
            for f in sboms/*; do
              [ -f "${f}" ] && echo "- $(basename "${f}")"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
          cat release-metadata.json

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Attach SBOMs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" sboms/* --clobber
