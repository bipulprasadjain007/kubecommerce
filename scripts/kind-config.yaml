# =============================================================================
# KubeCommerce - kind cluster configuration (default shape: 2 worker nodes).
#
# `scripts/kind-up.sh` renders this file into a temporary config so the worker
# count, cluster name and CNI profile can be overridden without editing this
# file:
#   WORKERS=<n>           number of worker nodes (default 2)
#   CLUSTER_NAME=<name>   cluster name (default kubecommerce)
#   CNI=calico            adds networking.disableDefaultCNI + podSubnet below
# The block between the WORKER_NODES markers below is regenerated from $WORKERS.
#
# Host port mappings:
#   * Host 80 -> control-plane container 30080. The Gateway listener is HTTP :80
#     and the parallel GitOps lane (platform/gateway/envoyproxy.yaml) switches
#     the Envoy Gateway data-plane Service to NodePort 30080, so
#     `http://localhost/` reaches the Gateway.
#   * There is intentionally NO 443 mapping yet: Phase H adds host 443 ->
#     container 30443 when TLS/HTTPS lands.
#   * Mappings live on the control-plane node only. Docker can bind a given host
#     port once, so repeating the mapping on every worker would fail with
#     "port is already allocated". If the data plane moves to a worker, move the
#     mapping with it (never duplicate it).
#
# Node images are supplied by `scripts/kind-up.sh --image` (pinned + overridable
# via KIND_NODE_IMAGE) rather than hard-coded here.
#
# CNI: by default this config does NOT disable kindnet. When `CNI=calico`,
# kind-up.sh injects:
#   networking:
#     disableDefaultCNI: true
#     podSubnet: 10.244.0.0/16
# and installs Calico after the cluster is created.
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubecommerce
nodes:
  - role: control-plane
    labels:
      kubecommerce.io/node-role: control-plane
    extraPortMappings:
      # Host :80 -> Envoy Gateway data-plane NodePort 30080.
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      # Phase H adds: host 443 -> container 30443 (HTTPS/TLS) when TLS lands.
  # --- WORKER_NODES_BEGIN (regenerated by scripts/kind-up.sh from $WORKERS) ---
  - role: worker
    labels:
      kubecommerce.io/node-role: worker
  - role: worker
    labels:
      kubecommerce.io/node-role: worker
  # --- WORKER_NODES_END ---
